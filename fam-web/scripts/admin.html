<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAM — Локальная студия</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/antiquity.css"><style>
body{color-scheme:dark}.admin-shell{max-width:1320px;padding:0 36px 50px;margin:auto}.admin-header{display:flex;align-items:center;justify-content:space-between;padding:35px 0;border-bottom:1px solid var(--line)}.admin-header h1{font-size:30px;font-weight:400;margin:10px 0}.admin-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;margin-top:28px}.admin-panel{border:1px solid var(--line);padding:24px;margin-bottom:20px}.admin-panel h2{font-size:18px;font-weight:400;margin:0 0 20px}.admin-panel p{color:var(--muted);font-size:12px;line-height:1.8}.admin-stats{display:flex;gap:32px;margin:25px 0}.admin-stats strong{display:block;font:40px var(--serif);font-weight:400}.admin-stats span{font-size:10px;color:var(--muted)}.admin-input,.admin-panel textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;font-size:12px;margin:6px 0 12px}.admin-panel label{font-size:11px;color:var(--muted)}.admin-row{border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:15px 0}.admin-row button{background:none;color:var(--accent);font-size:11px}.admin-row strong{font-size:13px;font-weight:400;display:block;line-height:1.5}.admin-row small{font-size:10px;color:var(--muted);display:block;margin-top:5px}.admin-row>div{flex:1}.admin-secondary{background:var(--panel2);padding:12px 16px;font-size:12px;display:inline-flex;gap:10px;margin:4px 5px 4px 0}.admin-message{font-size:12px;color:var(--accent);line-height:1.7;padding:12px 0;overflow-wrap:anywhere}.admin-code{font:12px monospace;overflow-wrap:anywhere;background:var(--panel2);padding:16px;margin-top:12px;user-select:all}.admin-editor{width:min(650px,95vw);padding:28px}.admin-editor .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.admin-editor label{font-size:11px;color:var(--muted)}.admin-editor h2{font-size:20px;font-weight:400}.admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.admin-search{flex:1;min-width:120px}.warning-text{color:#e6b882!important}.admin-log{font:10px monospace;color:var(--muted);white-space:pre-wrap;line-height:1.6}.admin-tabs{display:flex;gap:5px;margin-top:20px}.admin-tabs button{padding:12px;background:var(--panel);font-size:11px}.admin-tabs button.active{color:var(--accent)}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.admin-shell{padding:0 18px 30px}.admin-header{gap:15px}.admin-header h1{font-size:24px}.admin-stats{gap:20px}.admin-stats strong{font-size:24px}}
</style><script type="module" src="/admin.mjs"></script></head><body><main class="admin-shell"><header class="admin-header"><div><div class="eyebrow">FAM / ЛОКАЛЬНАЯ ПАНЕЛЬ</div><h1>Управление библиотекой</h1><span class="muted" style="font-size:11px">Только на этом компьютере · Windows DPAPI</span></div><a class="primary-btn" href="/" target="_blank">Открыть библиотеку ↗</a></header><div id="admin-message" class="admin-message" role="status">Подключение…</div><div id="admin-content"></div></main><dialog id="editor" class="admin-editor"></dialog></body></html>
